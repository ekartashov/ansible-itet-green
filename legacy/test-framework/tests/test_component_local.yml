---
- name: Test Component-Level Monitoring on lostsecret-intel (localhost)
  hosts: localhost
  become: yes
  tasks:
    - name: Run component-level monitoring script (using power_monitoring role)
      command: /usr/local/share/zabbix_power_monitoring/read_redfish_power.sh
      register: component_output
      failed_when: component_output.rc != 0
      ignore_errors: yes

    - name: Display component-level output
      debug:
        msg: "Component-Level Monitoring Output: {{ component_output.stdout_lines }}"
      when: component_output is defined and component_output.stdout_lines is defined

    - name: Log Component-Level Monitoring Results to ConPort
      command: echo "{{ component_output.stdout_lines }}" | uvx --from context-portal-mcp conport-mcp --mode stdio --workspace_id /home/user/itet-green/ansible-lostsecret-intel --log-file ./logs/conport.log --log-level INFO log_custom_data category="test_results" key="component_local_output" value="{{ component_output.stdout_lines }}"
      ignore_errors: yes