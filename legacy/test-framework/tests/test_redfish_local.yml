---
- name: Test Redfish Power Monitoring on lostsecret-intel (localhost)
  hosts: localhost
  become: yes
  tasks:
    - name: Run Redfish power monitoring script (using power_monitoring role)
      command: /usr/local/share/zabbix_power_monitoring/read_redfish_power.sh
      register: redfish_output
      failed_when: redfish_output.rc != 0
      ignore_errors: yes

    - name: Display Redfish output
      debug:
        msg: "Redfish Power Monitoring Output: {{ redfish_output.stdout_lines }}"
      when: redfish_output is defined and redfish_output.stdout_lines is defined

    - name: Log Redfish Power Monitoring Results to ConPort
      command: echo "{{ redfish_output.stdout_lines }}" | uvx --from context-portal-mcp conport-mcp --mode stdio --workspace_id /home/user/itet-green/ansible-lostsecret-intel --log-file ./logs/conport.log --log-level INFO log_custom_data category="test_results" key="redfish_local_output" value="{{ redfish_output.stdout_lines }}"
      ignore_errors: yes