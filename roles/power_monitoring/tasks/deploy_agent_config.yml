---
# Task file for deploying Zabbix agent configuration

- name: Template and deploy Zabbix agent configuration
  template:
    src: power.conf.j2
    dest: /etc/zabbix/zabbix_agentd.d/power.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart zabbix agent

- name: (Test) Verify Zabbix agent configuration file was created
  stat:
    path: /etc/zabbix/zabbix_agentd.d/power.conf
  register: zabbix_conf_stat

- name: Display Zabbix configuration status
  debug:
    msg: "Zabbix configuration file exists: {{ zabbix_conf_stat.stat.exists }}"
