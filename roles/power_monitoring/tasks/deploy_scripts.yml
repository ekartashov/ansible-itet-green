---
# Task file for deploying monitoring scripts

- name: Create directory for power monitoring scripts
  file:
    path: /usr/local/share/zabbix_power_monitoring
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template and deploy CPU RAPL monitoring script
  template:
    src: read_cpu_rapl_power.sh.j2
    dest: /usr/local/share/zabbix_power_monitoring/read_cpu_rapl_power.sh
    owner: root
    group: root
    mode: '0755'
  when:
    - power_monitoring_enable_cpu | default('auto') != 'false'
    - power_monitoring_has_intel_rapl | default(false)

- name: Template and deploy AMD CPU hwmon monitoring script
  template:
    src: read_cpu_amd_hwmon.sh.j2
    dest: /usr/local/share/zabbix_power_monitoring/read_cpu_amd_hwmon.sh.j2
    owner: root
    group: root
    mode: '0755'
  when:
    - power_monitoring_enable_cpu | default('auto') != 'false'
    - not power_monitoring_has_intel_rapl | default(false)
    - power_monitoring_has_amd_cpu_hwmon | default(false)

- name: Template and deploy RAM RAPL monitoring script
  template:
    src: read_ram_rapl_power.sh.j2
    dest: /usr/local/share/zabbix_power_monitoring/read_ram_rapl_power.sh
    owner: root
    group: root
    mode: '0755'
  when:
    - power_monitoring_enable_ram | default('auto') != 'false'
    - power_monitoring_has_ram_rapl | default(false)

