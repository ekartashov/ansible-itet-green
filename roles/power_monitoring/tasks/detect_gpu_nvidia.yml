---
# Task file for detecting NVIDIA GPU capabilities

- name: Query NVIDIA GPUs via nvidia-smi
  ansible.builtin.command: >
    nvidia-smi --query-gpu=index --format=csv,noheader,nounits
  register: nvidia_smi_query
  changed_when: false
  failed_when: false

- name: Set facts for NVIDIA GPU availability
  ansible.builtin.set_fact:
    power_monitoring_has_nvidia_gpu: >-
      {{ nvidia_smi_query.rc == 0
         and (nvidia_smi_query.stdout_lines | default([]) | length) > 0 }}
    power_monitoring_nvidia_gpu_indices: >-
      {{ nvidia_smi_query.stdout_lines | default([]) | map('trim') | list }}
  when: nvidia_smi_query is defined

- name: Display NVIDIA GPU detection results
  ansible.builtin.debug:
    msg: >-
      NVIDIA GPU: {{ power_monitoring_has_nvidia_gpu | default(false) }}
      (indices={{ power_monitoring_nvidia_gpu_indices | default([]) }})
