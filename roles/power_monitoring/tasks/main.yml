---
# Main task file for power_monitoring role

# CPU RAPL detection
- name: Include RAPL detection tasks
  include_tasks: detect_rapl.yml

# CPU RAM RAPL detection
- name: Include RAM RAPL detection tasks
  include_tasks: detect_ram_rapl.yml
  when: power_monitoring_enable_ram | default('auto') != 'false'

# NVIDIA GPU detection
- name: Include NVIDIA GPU detection tasks
  include_tasks: detect_gpu_nvidia.yml
  when: power_monitoring_enable_gpu | default('auto') != 'false'

# AMD GPU detection
- name: Include AMD GPU detection tasks
  include_tasks: detect_gpu_amd.yml
  when: power_monitoring_enable_gpu | default('auto') != 'false'

# Redfish detection
- name: Include Redfish detection tasks
  include_tasks: detect_redfish.yml
  when: power_monitoring_enable_redfish | default('auto') != 'false'

# Deploy scripts (CPU/RAM/GPU/Redfish)
- name: Deploy monitoring scripts
  include_tasks: deploy_scripts.yml

