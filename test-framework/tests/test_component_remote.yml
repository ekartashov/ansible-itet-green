---
- name: Test Component-Level Monitoring on lostsecret-amd (SSH)
  hosts: lostsecret-amd
  become: yes
  tasks:
    - name: Run component-level monitoring script
      command: /home/user/itet-green/ansible-lostsecret-intel/roles/base/files/get_power_redfish.py
      register: component_output
      failed_when: component_output.rc != 0

    - name: Display component-level output
      debug:
        msg: "Component-Level Monitoring Output: {{ component_output.stdout_lines }}"
      when: component_output is defined and component_output.stdout_lines is defined

    - name: Log Component-Level Monitoring Results to ConPort
      command: echo "{{ component_output.stdout_lines }}" | uvx --from context-portal-mcp conport-mcp --mode stdio --workspace_id /home/user/itet-green/ansible-lostsecret-intel --log-file ./logs/conport.log --log-level INFO log_custom_data category="test_results" key="component_remote_output" value="{{ component_output.stdout_lines }}"
      ignore_errors: yes